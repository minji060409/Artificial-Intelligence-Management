name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    name: Validate scenarios & syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate scenarios.json
        run: python scripts/validate_scenarios.py --file data/scenarios.json --schema schemas/scenario.schema.json

      - name: App syntax check (ast.parse)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          failed = False
          for p in ["app.py", "narrative_app.py"]:
              path = pathlib.Path(p)
              if not path.exists():
                  print(f"[skip] {p} 없음")
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
                  print(f"[ok] {p}")
              except SyntaxError as e:
                  print(f"[FAIL] {p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            docs/**/*.md
            README.md
        continue-on-error: true
